<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IAF MultiTools — Video Converter</title>

<meta
    name="description"
    content="Local-first browser video converter powered by FFmpeg.wasm."
>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #141414;
    --panel: #1c1c1c;
    --panel2: #222;
    --border: #333;
    --text: #fff;
    --muted: #8d8d8d;
    --dim: #666;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    padding: 32px;

    background: var(--bg);
    color: var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
select,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;
}

/* HEADER */

.header {
    margin-bottom: 24px;
}

.eyebrow {
    color: var(--muted);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .16em;
    text-transform: uppercase;
}

h1 {
    margin: 7px 0;

    font-size: clamp(30px, 5vw, 44px);
    line-height: 1;

    letter-spacing: -.05em;
}

.subtitle {
    margin: 0;

    color: var(--muted);

    font-size: 14px;
}

/* PANEL */

.panel {
    padding: 20px;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 14px;
}

/* DROPZONE */

.dropzone {
    min-height: 230px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;

    text-align: center;

    border: 2px dashed #3b3b3b;
    border-radius: 11px;

    cursor: pointer;

    transition:
        border-color .15s ease,
        background .15s ease,
        transform .15s ease;
}

.dropzone:hover {
    background: #202020;
    border-color: #555;
}

.dropzone.dragover {
    background: #242424;
    border-color: #888;

    transform: scale(1.005);
}

.drop-icon {
    width: 54px;
    height: 54px;

    display: grid;
    place-items: center;

    margin-bottom: 17px;

    border: 1px solid #3b3b3b;
    border-radius: 12px;

    font-size: 23px;
}

.drop-title {
    margin-bottom: 7px;

    font-size: 18px;
    font-weight: 800;
}

.drop-subtitle {
    color: var(--muted);

    font-size: 13px;
}

.drop-formats {
    margin-top: 15px;

    color: var(--dim);

    font-size: 11px;
    letter-spacing: .05em;
    text-transform: uppercase;
}

input[type="file"] {
    display: none;
}

/* FILE */

.file-card {
    display: none;

    align-items: center;

    gap: 13px;

    margin-top: 14px;
    padding: 14px;

    background: var(--panel2);

    border: 1px solid #292929;
    border-radius: 9px;
}

.file-card.visible {
    display: flex;
}

.file-icon {
    width: 40px;
    height: 40px;

    flex: 0 0 auto;

    display: grid;
    place-items: center;

    border: 1px solid #3b3b3b;
    border-radius: 8px;

    font-size: 11px;
    font-weight: 800;
}

.file-details {
    min-width: 0;

    flex: 1;
}

.file-name {
    overflow: hidden;

    font-size: 14px;
    font-weight: 700;

    text-overflow: ellipsis;
    white-space: nowrap;
}

.file-meta {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

.remove-file {
    width: 34px;
    height: 34px;

    flex: 0 0 auto;

    border: 1px solid #3a3a3a;
    border-radius: 7px;

    background: transparent;
    color: #aaa;

    font-size: 16px;
}

.remove-file:hover {
    background: #2b2b2b;
    color: white;
}

/* SETTINGS */

.settings {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 14px;

    margin-top: 18px;
}

.setting {
    display: flex;
    flex-direction: column;

    gap: 7px;
}

.setting-label {
    color: var(--muted);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .11em;
    text-transform: uppercase;
}

select {
    width: 100%;

    padding: 12px 13px;

    appearance: none;

    outline: none;

    background: #242424;
    color: white;

    border: 1px solid #383838;
    border-radius: 8px;
}

select:focus {
    border-color: #666;
}

/* BUTTON */

.convert-button {
    width: 100%;

    margin-top: 18px;
    padding: 14px;

    border: 0;
    border-radius: 8px;

    background: white;
    color: #111;

    font-size: 14px;
    font-weight: 900;
}

.convert-button:hover:not(:disabled) {
    opacity: .88;
}

.convert-button:disabled {
    opacity: .35;

    cursor: not-allowed;
}

/* STATUS */

.status {
    display: none;

    margin-top: 18px;
    padding: 15px;

    background: #202020;

    border: 1px solid #292929;
    border-radius: 9px;
}

.status.visible {
    display: block;
}

.status-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.status-title {
    font-size: 13px;
    font-weight: 800;
}

.status-percent {
    color: var(--muted);

    font-size: 12px;

    font-variant-numeric: tabular-nums;
}

.progress-track {
    width: 100%;
    height: 7px;

    margin-top: 12px;

    overflow: hidden;

    background: #303030;

    border-radius: 999px;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: white;

    transition: width .1s linear;
}

.status-details {
    display: flex;
    justify-content: space-between;

    gap: 10px;

    margin-top: 9px;

    color: var(--dim);

    font-size: 11px;
}

/* LOG */

.log {
    max-height: 140px;

    overflow: auto;

    margin-top: 12px;
    padding: 10px;

    background: #151515;

    border: 1px solid #292929;
    border-radius: 7px;

    color: #888;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 10px;

    white-space: pre-wrap;
}

.log:empty {
    display: none;
}

/* CANCEL */

.cancel-button {
    width: 100%;

    margin-top: 12px;
    padding: 10px;

    border: 1px solid #383838;
    border-radius: 8px;

    background: transparent;
    color: #aaa;

    font-size: 12px;
    font-weight: 700;
}

.cancel-button:hover {
    background: #292929;
    color: white;
}

/* RESULT */

.result {
    display: none;

    margin-top: 18px;
    padding: 16px;

    background: #202020;

    border: 1px solid #353535;
    border-radius: 9px;
}

.result.visible {
    display: block;
}

.result-title {
    font-size: 14px;
    font-weight: 900;
}

.result-meta {
    margin-top: 5px;

    color: var(--muted);

    font-size: 12px;
}

.download-button {
    display: block;

    margin-top: 13px;
    padding: 12px;

    background: white;
    color: #111;

    border-radius: 8px;

    text-align: center;
    text-decoration: none;

    font-size: 13px;
    font-weight: 900;
}

/* ERROR */

.error {
    display: none;

    margin-top: 14px;
    padding: 12px;

    background: #241919;

    border: 1px solid #4a2a2a;
    border-radius: 8px;

    color: #ff9a9a;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 11px;

    white-space: pre-wrap;
}

.error.visible {
    display: block;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-between;

    gap: 20px;

    margin-top: 17px;

    color: var(--dim);

    font-size: 11px;
}

/* MOBILE */

@media (max-width: 650px) {

    body {
        padding: 18px;
    }

    .panel {
        padding: 14px;
    }

    .settings {
        grid-template-columns: 1fr;
    }

    .footer {
        flex-direction: column;

        gap: 5px;
    }
}
</style>
</head>


<body>

<div class="app">

<header class="header">

    <div class="eyebrow">
        IAF MultiTools / Video
    </div>

    <h1>
        Video Converter
    </h1>

    <p class="subtitle">
        Convert video locally in your browser.
    </p>

</header>


<main class="panel">

        class="dropzone"

    >

        <div class="drop-icon">

        </div>

        <div class="drop-title">

        </div>

        <div class="drop-subtitle">

        </div>

        <input
            id="videoInput"

        class="file-card"

        <div class="file-icon">

            <div

                —

<script type="module">

/*
    ========================================================
    FFmpeg.wasm
    ========================================================

    IMPORTANT:

    This prototype intentionally uses:
        @ffmpeg/ffmpeg 0.12.6
        @ffmpeg/core 0.12.6

    They are kept on the same version to avoid the
    version mismatch from the previous prototype.
*/


import {
    FFmpeg
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js";

import {
    fetchFile,
    toBlobURL
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";


/* ========================================================
   DOM
======================================================== */

const videoInput =
    document.getElementById("videoInput");

const dropzone =
    document.getElementById("dropzone");

const fileCard =
    document.getElementById("fileCard");

const fileName =
    document.getElementById("fileName");

const fileMeta =
    document.getElementById("fileMeta");

const removeFile =
    document.getElementById("removeFile");

const formatSelect =
    document.getElementById("format");

const resolutionSelect =
    document.getElementById("resolution");

const qualitySelect =
    document.getElementById("quality");

const audioSelect =
    document.getElementById("audio");

const convertButton =
    document.getElementById("convertButton");

const status =
    document.getElementById("status");

const statusTitle =
    document.getElementById("statusTitle");

const statusPercent =
    document.getElementById("statusPercent");

const statusMessage =
    document.getElementById("statusMessage");

const progressBar =
    document.getElementById("progressBar");

const elapsed =
    document.getElementById("elapsed");

const cancelButton =
    document.getElementById("cancelButton");

const result =
    document.getElementById("result");

const resultMeta =
    document.getElementById("resultMeta");

const downloadButton =
    document.getElementById("downloadButton");

const errorBox =
    document.getElementById("error");

const logBox =
    document.getElementById("log");


/* ========================================================
   STATE
======================================================== */

let ffmpeg = null;

let ffmpegLoaded = false;

let selectedFile = null;

let converting = false;

let cancelRequested = false;

let outputUrl = null;

let timer = null;

let startTime = 0;


/* ========================================================
   HELPERS
======================================================== */

function formatBytes(bytes) {

    if (!bytes) {
        return "0 B";
    }

    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];

    const index = Math.floor(
        Math.log(bytes) /
        Math.log(1024)
    );

    return (
        (
            bytes /
            Math.pow(1024, index)
        ).toFixed(2)
        +
        " "
        +
        units[index]
    );
}


function formatTime(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(secs).padStart(2, "0")
    );
}


function log(message) {

    const line =
        document.createElement("div");

    line.textContent =
        `[${new Date().toLocaleTimeString()}] ${message}`;

    logBox.appendChild(line);

    logBox.scrollTop =
        logBox.scrollHeight;

    console.log(message);
}


function showError(message) {

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "visible"
    );
}


function clearError() {

    errorBox.textContent = "";

    errorBox.classList.remove(
        "visible"
    );
}


function resetResult() {

    result.classList.remove(
        "visible"
    );

    if (outputUrl) {

        URL.revokeObjectURL(
            outputUrl
        );

        outputUrl = null;
    }

    downloadButton.removeAttribute(
        "href"
    );
}


function startTimer() {

    startTime =
        Date.now();

    elapsed.textContent =
        "00:00";

    timer =
        setInterval(
            () => {

                elapsed.textContent =
                    formatTime(
                        (
                            Date.now() -
                            startTime
                        ) / 1000
                    );

            },
            250
        );
}


function stopTimer() {

    if (timer) {

        clearInterval(
            timer
        );

        timer = null;
    }
}


/* ========================================================
   FFmpeg
======================================================== */

async function loadFFmpeg() {

    if (ffmpegLoaded) {
        return;
    }


    status.classList.add(
        "visible"
    );

    statusTitle.textContent =
        "Loading FFmpeg";

    statusMessage.textContent =
        "Downloading codec core...";

    statusPercent.textContent =
        "0%";

    progressBar.style.width =
        "0%";


    log(
        "Creating FFmpeg instance..."
    );


    ffmpeg =
        new FFmpeg();


    /*
        FFmpeg log output
    */

    ffmpeg.on(
        "log",
        ({ message }) => {

            log(message);

        }
    );


    /*
        Conversion progress
    */

    ffmpeg.on(
        "progress",
        ({ progress }) => {

            if (!converting) {
                return;
            }

            const percent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            progress * 100
                        )
                    )
                );

            progressBar.style.width =
                `${percent}%`;

            statusPercent.textContent =
                `${percent}%`;

            statusMessage.textContent =
                "Encoding video...";

        }
    );


    /*
        IMPORTANT:

        Use the single-thread core.

        All three FFmpeg files come from
        the SAME core version.
    */

    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";


    log(
        "Loading FFmpeg core..."
    );


    try {

        await ffmpeg.load({

            coreURL:
                await toBlobURL(
                    `${baseURL}/ffmpeg-core.js`,
                    "text/javascript"
                ),

            wasmURL:
                await toBlobURL(
                    `${baseURL}/ffmpeg-core.wasm`,
                    "application/wasm"
                )

        });

    } catch (error) {

        log(
            "FFmpeg core failed to load."
        );

        throw error;
    }


    ffmpegLoaded =
        true;


    statusTitle.textContent =
        "FFmpeg ready";

    statusMessage.textContent =
        "Codec engine loaded.";

    statusPercent.textContent =
        "0%";

    progressBar.style.width =
        "0%";


    log(
        "FFmpeg loaded successfully."
    );
}


/* ========================================================
   FILE
======================================================== */

function selectFile(file) {

    if (!file) {
        return;
    }


    clearError();

    resetResult();


    const extensionOK =
        /\.(mp4|mkv|mov|avi|webm|mpeg|mpg|m4v)$/i
            .test(file.name);


    if (
        !file.type.startsWith("video/")
        &&
        !extensionOK
    ) {

        showError(
            "Unsupported video file."
        );

        return;
    }


    selectedFile =
        file;


    fileName.textContent =
        file.name;

    fileMeta.textContent =
        `${formatBytes(file.size)} · ${file.type || "video"}`;


    fileCard.classList.add(
        "visible"
    );


    convertButton.disabled =
        false;


    log(
        `Selected: ${file.name}`
    );
}


function clearFile() {

    selectedFile =
        null;

    videoInput.value =
        "";

    fileCard.classList.remove(
        "visible"
    );

    convertButton.disabled =
        true;

    resetResult();

    clearError();

    logBox.innerHTML =
        "";
}


videoInput.addEventListener(
    "change",
    () => {

        selectFile(
            videoInput.files[0]
        );

    }
);


removeFile.addEventListener(
    "click",
    clearFile
);


/* ========================================================
   DRAG DROP
======================================================== */

dropzone.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropzone.classList.add(
            "dragover"
        );

    }
);


dropzone.addEventListener(
    "dragleave",
    () => {

        dropzone.classList.remove(
            "dragover"
        );

    }
);


dropzone.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropzone.classList.remove(
            "dragover"
        );

        selectFile(
            event.dataTransfer.files[0]
        );

    }
);


/* ========================================================
   FFmpeg ARGUMENTS
======================================================== */

function buildArguments(
    input,
    output
) {

    const format =
        formatSelect.value;

    const resolution =
        resolutionSelect.value;

    const crf =
        qualitySelect.value;

    const audio =
        audioSelect.value;


    const args = [
        "-i",
        input
    ];


    /*
        Video codec
    */

    if (format === "webm") {

        args.push(
            "-c:v",
            "libvpx-vp9",

            "-crf",
            crf,

            "-b:v",
            "0"
        );

    } else {

        args.push(
            "-c:v",
            "libx264",

            "-preset",
            "medium",

            "-crf",
            crf
        );
    }


    /*
        Resolution
    */

    if (
        resolution !== "original"
    ) {

        args.push(
            "-vf",
            `scale=-2:${resolution}`
        );

    }


    /*
        Audio
    */

    if (format === "webm") {

        args.push(
            "-c:a",
            "libopus",

            "-b:a",
            audio
        );

    } else {

        args.push(
            "-c:a",
            "aac",

            "-b:a",
            audio
        );

    }


    /*
        MP4
    */

    if (format === "mp4") {

        args.push(
            "-movflags",
            "+faststart"
        );

    }


    args.push(
        "-y",
        output
    );


    return args;
}


/* ========================================================
   CONVERT
======================================================== */

async function convertVideo() {

    if (!selectedFile) {
        return;
    }

    if (converting) {
        return;
    }


    clearError();

    resetResult();


    converting =
        true;

    cancelRequested =
        false;


    convertButton.disabled =
        true;

    cancelButton.disabled =
        false;


    status.classList.add(
        "visible"
    );


    statusTitle.textContent =
        "Preparing";

    statusMessage.textContent =
        "Starting FFmpeg...";

    statusPercent.textContent =
        "0%";

    progressBar.style.width =
        "0%";


    logBox.innerHTML =
        "";


    startTimer();


    try {

        /*
            Load FFmpeg first.
        */

        await loadFFmpeg();


        if (cancelRequested) {
            throw new Error(
                "Conversion cancelled."
            );
        }


        const inputExtension =
            (
                selectedFile.name
                    .split(".")
                    .pop()
                    .toLowerCase()
            );


        const inputName =
            `input.${inputExtension}`;


        const outputExtension =
            formatSelect.value;


        const outputName =
            `output.${outputExtension}`;


        log(
            `Writing ${selectedFile.name} to virtual filesystem...`
        );


        await ffmpeg.writeFile(
            inputName,
            await fetchFile(
                selectedFile
            )
        );


        if (cancelRequested) {
            throw new Error(
                "Conversion cancelled."
            );
        }


        const args =
            buildArguments(
                inputName,
                outputName
            );


        log(
            `ffmpeg ${args.join(" ")}`
        );


        statusTitle.textContent =
            "Converting";

        statusMessage.textContent =
            "Encoding video...";


        await ffmpeg.exec(
            args
        );


        if (cancelRequested) {
            throw new Error(
                "Conversion cancelled."
            );
        }


        statusTitle.textContent =
            "Finalizing";

        statusMessage.textContent =
            "Reading output...";


        const data =
            await ffmpeg.readFile(
                outputName
            );


        const bytes =
            data instanceof Uint8Array
                ? data
                : new Uint8Array(data);


        const mime =
            outputExtension === "webm"
                ? "video/webm"
                : outputExtension === "mkv"
                    ? "video/x-matroska"
                    : "video/mp4";


        const blob =
            new Blob(
                [bytes],
                {
                    type: mime
                }
            );


        outputUrl =
            URL.createObjectURL(
                blob
            );


        downloadButton.href =
            outputUrl;


        downloadButton.download =
            createFilename(
                selectedFile.name,
                outputExtension
            );


        resultMeta.textContent =
            `${formatBytes(blob.size)} · ${outputExtension.toUpperCase()}`;


        result.classList.add(
            "visible"
        );


        progressBar.style.width =
            "100%";

        statusPercent.textContent =
            "100%";


        statusTitle.textContent =
            "Conversion complete";

        statusMessage.textContent =
            "Output is ready.";


        log(
            `Finished: ${formatBytes(blob.size)}`
        );


        /*
            Cleanup virtual filesystem.
        */

        try {

            await ffmpeg.deleteFile(
                inputName
            );

            await ffmpeg.deleteFile(
                outputName
            );

        } catch (_) {

            log(
                "Virtual filesystem cleanup skipped."
            );
        }


    } catch (error) {

        console.error(
            error
        );


        if (
            cancelRequested
            ||
            error.message ===
                "Conversion cancelled."
        ) {

            statusTitle.textContent =
                "Cancelled";

            statusMessage.textContent =
                "Conversion stopped.";

            statusPercent.textContent =
                "0%";

            progressBar.style.width =
                "0%";


        } else {

            statusTitle.textContent =
                "Conversion failed";

            statusMessage.textContent =
                "See error details below.";

            showError(
                error?.stack ||
                error?.message ||
                String(error)
            );

        }

    } finally {

        stopTimer();

        converting =
            false;

        convertButton.disabled =
            !selectedFile;

        cancelButton.disabled =
            false;
    }
}


/* ========================================================
   CANCEL
======================================================== */

cancelButton.addEventListener(
    "click",
    async () => {

        if (!converting) {
            return;
        }


        cancelRequested =
            true;


        statusTitle.textContent =
            "Cancelling";

        statusMessage.textContent =
            "Stopping FFmpeg...";


        if (ffmpeg) {

            try {

                ffmpeg.terminate();

            } catch (_) {
                // Ignore.
            }

        }


        /*
            A terminated FFmpeg instance cannot
            safely be reused.

            Create a fresh one next time.
        */

        ffmpeg =
            null;

        ffmpegLoaded =
            false;

        converting =
            false;


        stopTimer();


        statusTitle.textContent =
            "Cancelled";

        statusMessage.textContent =
            "Ready for another conversion.";

        statusPercent.textContent =
            "0%";

        progressBar.style.width =
            "0%";


        convertButton.disabled =
            !selectedFile;

    }
);


/* ========================================================
   FILENAME
======================================================== */

function createFilename(
    original,
    extension
) {

    const dot =
        original.lastIndexOf(".");


    const base =
        dot > 0
            ? original.slice(
                0,
                dot
            )
            : original;


    return (
        `${base}-converted.${extension}`
    );
}


/* ========================================================
   RESET RESULT WHEN SETTINGS CHANGE
======================================================== */

formatSelect.addEventListener(
    "change",
    resetResult
);

resolutionSelect.addEventListener(
    "change",
    resetResult
);

qualitySelect.addEventListener(
    "change",
    resetResult
);

audioSelect.addEventListener(
    "change",
    resetResult
);


/* ========================================================
   READY
======================================================== */

console.log(
    "IAF Video Converter loaded."
);

</script>
